name: TreeGit Windows portable
on:
  push:
    branches: [master]
    tags: ['treegit-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build portable TreeGit
        shell: pwsh
        run: ./build-treegit.ps1 -Destination "$env:RUNNER_TEMP/TreeGit"
      - name: Package
        shell: pwsh
        run: |
          ./package-treegit.ps1 -Source "$env:RUNNER_TEMP/TreeGit" -Destination .
      - uses: actions/upload-artifact@v4
        with:
          name: TreeGit-Windows-x64
          path: |
            TreeGit-*-Windows-x64.zip
            SHA256SUMS.txt
