name: TreeGit Windows portable
on:
  push:
    branches: [master]
    tags: ['treegit-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build isolated cancellation checks
        shell: pwsh
        run: |
          dotnet build src/SourceGit.csproj -c Debug -p:EnableIntegrationTests=true -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/CancellationHelper.csproj -c Release -o "$env:RUNNER_TEMP/cancellation-helper" -v:q
      - name: Verify large query output and malformed authentication settings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src/bin/Debug/net10.0/data -Force | Out-Null
          python tests/command_pipes.py src/bin/Debug/net10.0/SourceGit.exe "$env:RUNNER_TEMP/command-pipes-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/command_pipes.py src/bin/Debug/net10.0/SourceGit.exe "$env:RUNNER_TEMP/streaming-query-results" --streaming
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify authentication changes during an in-flight read
        shell: pwsh
        run: |
          dotnet build tests/RepositoryModeProbe.csproj -c Release -o "$env:RUNNER_TEMP/mode-probe" -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/mode-probe/RepositoryModeProbe.exe" "$env:RUNNER_TEMP/mode-results" (Get-Command git.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify incomplete-package startup guidance
        shell: pwsh
        run: |
          dotnet build tests/UiStartupProbe.csproj -c Release -o "$env:RUNNER_TEMP/startup-probe" -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/startup-probe/UiStartupProbe.exe" "$env:RUNNER_TEMP/startup-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify cancellation affects only the command tree
        shell: pwsh
        run: python tests/process_cancellation.py src/bin/Debug/net10.0/SourceGit.exe "$env:RUNNER_TEMP/cancellation-helper/CancellationHelper.exe" "$env:RUNNER_TEMP/cancellation-results"
      - name: Verify GUI without an installed Git
        shell: pwsh
        run: |
          . ./build/git-runtime.ps1
          $null=Initialize-TreeGitRuntime -Destination src/bin/Debug/net10.0/git -CacheDirectory "$env:RUNNER_TEMP/component-cache" -LockFile ./build/git-runtime.lock.json -Notices ./docs/GIT-COMPONENTS.md
          New-Item -ItemType Directory -Path src/bin/Debug/net10.0/data -Force | Out-Null
          python tests/git_runtime.py src/bin/Debug/net10.0/SourceGit.exe "$env:RUNNER_TEMP/runtime-ui-results" (Get-Command git.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify closing during an active native commit
        shell: pwsh
        run: python tests/close_during_commit.py src/bin/Debug/net10.0/SourceGit.exe "${{ runner.temp }}/close-during-commit-results"
      - name: Verify partially corrupt preference structures
        shell: pwsh
        run: python tests/preferences_schema.py src/bin/Debug/net10.0/SourceGit.exe "${{ runner.temp }}/preferences-schema-results"
      - name: Verify saving before closing a window or tab
        shell: pwsh
        run: python tests/close_save_failure.py src/bin/Debug/net10.0/SourceGit.exe "${{ runner.temp }}/close-save-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreeGit-cancellation-results
          path: |
            ${{ runner.temp }}/cancellation-results
            ${{ runner.temp }}/runtime-ui-results
            ${{ runner.temp }}/command-pipes-results
            ${{ runner.temp }}/streaming-query-results/command-pipes-results.json
            ${{ runner.temp }}/mode-results/repository-mode-results.json
            ${{ runner.temp }}/startup-results/ui-startup-results.json
            ${{ runner.temp }}/close-during-commit-results/close-during-commit-results.json
            ${{ runner.temp }}/preferences-schema-results/preferences-schema-results.json
            ${{ runner.temp }}/close-save-results/close-save-results.json
            ${{ runner.temp }}/close-save-results/*.png
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify upstream controls and actions
        shell: pwsh
        run: python tests/preserve_upstream.py
      - name: Build portable TreeGit
        shell: pwsh
        run: ./build-treegit.ps1 -Destination "$env:RUNNER_TEMP/TreeGit"
      - name: Package
        shell: pwsh
        run: |
          ./package-treegit.ps1 -Source "$env:RUNNER_TEMP/TreeGit" -Destination .
      - name: Verify Git discovery and bundled runtime
        shell: pwsh
        run: |
          dotnet build tests/GitDiscoveryProbe.csproj -c Release -o "$env:RUNNER_TEMP/discovery-probe" -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/discovery-probe/GitDiscoveryProbe.exe" "$env:RUNNER_TEMP/discovery-results" "$env:RUNNER_TEMP/TreeGit/git/cmd/git.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify update validation and recovery
        shell: pwsh
        run: |
          dotnet build tests/UpdaterProbe.csproj -c Release -o "$env:RUNNER_TEMP/updater-probe" -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = (Get-ChildItem TreeGit-*-Windows-x64.zip | Select-Object -First 1).FullName
          & "$env:RUNNER_TEMP/updater-probe/UpdaterProbe.exe" "$env:RUNNER_TEMP/updater-results" $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MCP protocol and portable packaging
        shell: pwsh
        run: |
          python tests/mcp_protocol.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/treegit-protocol.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/font_settings.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/font-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/deferred_loading.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/deferred-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/package_smoke.py "$env:RUNNER_TEMP/treegit-package-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/startup_incomplete.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/startup-incomplete-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/preferences_recovery.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/preferences-recovery-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/repository_config_recovery.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/repository-config-recovery-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/binary_cancel.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/binary-cancellation-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/GitDelayProxy.csproj -c Release -o "$env:RUNNER_TEMP/git-delay-proxy" -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/cold_sync_actions.py "$env:RUNNER_TEMP/TreeGit/TreeGit.exe" "$env:RUNNER_TEMP/cold-sync-results" "$env:RUNNER_TEMP/git-delay-proxy/GitDelayProxy.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreeGit-ui-regressions
          path: |
            ${{ runner.temp }}/font-results/*.json
            ${{ runner.temp }}/font-results/*.png
            ${{ runner.temp }}/deferred-results/*.json
            ${{ runner.temp }}/deferred-results/*.png
            ${{ runner.temp }}/updater-results/results.json
            ${{ runner.temp }}/startup-incomplete-results/startup-incomplete-results.json
            ${{ runner.temp }}/preferences-recovery-results/preferences-recovery-results.json
            ${{ runner.temp }}/repository-config-recovery-results/repository-config-recovery-results.json
            ${{ runner.temp }}/binary-cancellation-results/binary-cancellation-results.json
            ${{ runner.temp }}/cold-sync-results/cold-sync-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: TreeGit-Windows-x64
          path: |
            TreeGit-*-Windows-x64.zip
            SHA256SUMS.txt
  updater-ui:
    needs: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: TreeGit-Windows-x64
          path: update-fixture
      - name: Verify update windows with the portable package
        shell: pwsh
        run: |
          dotnet build src/SourceGit.csproj -c Debug -p:EnableIntegrationTests=true -v:q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = (Get-ChildItem update-fixture/TreeGit-*-Windows-x64.zip | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Path src/bin/Debug/net10.0/data -Force | Out-Null
          & src/bin/Debug/net10.0/SourceGit.exe --integration-update-ui $archive "$env:RUNNER_TEMP/updater-ui-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreeGit-updater-ui-results
          path: |
            ${{ runner.temp }}/updater-ui-results/results.json
            ${{ runner.temp }}/updater-ui-results/*.png
