name: Localization Check
on:
  push:
    branches: [master, develop]
    paths:
      - 'src/**'
      - 'tests/localization_catalog.py'
      - '.github/workflows/localization-check.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/localization_catalog.py'
      - '.github/workflows/localization-check.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  localization-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the three shipped language catalogs
        run: python3 tests/localization_catalog.py
