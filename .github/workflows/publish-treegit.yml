name: Publish verified TreeGit release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      source:
        required: true
        type: string
      run_id:
        required: true
        type: string
      documentation:
        description: Optional documentation/gallery commit; the verified program is unchanged
        required: false
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'JonSun2020/TreeGit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Include reviewed documentation without rebuilding the verified program
        if: inputs.documentation != ''
        env:
          SOURCE: ${{ inputs.source }}
          DOCUMENTATION: ${{ inputs.documentation }}
        run: |
          [[ "$DOCUMENTATION" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$SOURCE" "$DOCUMENTATION" -- . ':(exclude)README.md' ':(exclude)docs/**' ':(exclude)tests/*.py' ':(exclude).github/workflows/publish-treegit.yml'
          git restore --source="$DOCUMENTATION" -- docs
          echo "Release documents: $DOCUMENTATION; program source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the exact verified portable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TREEGIT_VERSION: ${{ inputs.version }}
          TREEGIT_SOURCE: ${{ inputs.source }}
          TREEGIT_RUN_ID: ${{ inputs.run_id }}
        run: python3 build/publish-treegit.py
